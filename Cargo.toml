[workspace]
resolver = "3"
members = ["crates/*"]
# Clones of other repos, built separately.
exclude = ["upstream"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
tc2-emu-proto = { path = "crates/tc2-emu-proto" }
anyhow = "1"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }

[profile.release]
strip = true
